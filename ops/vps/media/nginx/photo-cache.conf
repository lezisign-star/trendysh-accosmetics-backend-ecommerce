# Shared by the two photo locations in nginx.conf (nginx does not inherit add_header into a location that sets its own).
proxy_cache photos;
proxy_cache_key "$uri";
proxy_cache_valid 200 206 60d;
proxy_cache_valid 404 1m;
proxy_cache_valid any 10s;
proxy_cache_lock on;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_hide_header Set-Cookie;
# imgproxy sends its own Cache-Control; only ours is passed on (nginx still reads imgproxy's for its own cache lifetime)
proxy_hide_header Cache-Control;
proxy_hide_header Expires;

add_header Access-Control-Allow-Origin "*" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Cache $upstream_cache_status always;
# A stored photo is never overwritten (every upload gets a new name), so a copy never goes stale.
# No "always" here on purpose: it is sent on successful answers only, so a browser never keeps a 404 or an error for a year.
add_header Cache-Control "public, max-age=31536000, immutable";
