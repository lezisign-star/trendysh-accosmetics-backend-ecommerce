spring:
  application:
    name: nairobi-beauty-hub-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nairobi_beauty_hub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # §4 C5: batches multiple inserts/updates of the same entity type into
          # one round trip instead of one-statement-per-row — cheap, unconditional
          # win on any bulk write (e.g. StockPostingService posting a multi-line
          # document), independent of the @EntityGraph fix for reads.
          batch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration

  task:
    scheduling:
      pool:
        # Boot's default is ONE scheduler thread shared by every @Scheduled job (stock-hold and order
        # expiry, guest-tracking cleanup, TumaBoda retry and reconciliation, ...). A TumaBoda poll that is
        # waiting out a slow network call must not hold the expiry sweeps back behind it.
        size: 4

app:
  jwt:
    # DEV DEFAULT ONLY — override with a real random secret via JWT_SECRET before
    # any non-local deployment. Must be >= 256 bits for HS256.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-before-any-real-deployment-32bytes}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:28800000} # 8h (staff)
    customer-access-token-expiration-ms: ${JWT_CUSTOMER_ACCESS_TOKEN_EXPIRATION_MS:900000} # 15 min (shoppers)
  auth:
    # Shopper sign-in = the short access token above + a rotating refresh token in an httpOnly cookie.
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:trendysh_rt}
    # Secure needs https (Chrome also accepts it on localhost). None is required while the
    # storefront and API sit on different sites (Render vs Railway); switch to Lax once they
    # share a registrable domain, e.g. api.trendyshaccosmetic.com.
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-same-site: ${COOKIE_SAME_SITE:None}
  # Where the storefront lives — used to build the links in verification / reset emails.
  frontend-url: ${FRONTEND_URL:http://localhost:5250}
  mail:
    # Unset = emails are only logged (dev). Set BREVO_API_KEY + MAIL_FROM_EMAIL to send for real.
    brevo-api-key: ${BREVO_API_KEY:}
    from-email: ${MAIL_FROM_EMAIL:}
    from-name: ${MAIL_FROM_NAME:Trendysh Accosmetic}
  cors:
    # 5173 is Vite's own default; 5250 is this project's fixed dev-preview
    # port (see the frontend's .claude/launch.json) — both are real local
    # dev origins, not a guess.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5250}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@nairobibeautyhub.co.ke}
    # Extra SUPER_ADMINs created on boot if missing (comma-separated); they set their password via
    # "Forgot your password?". trendyshaccosmetic@gmail.com is the shop owner's own address, given
    # to us directly for this purpose. Set BOOTSTRAP_ADDITIONAL_ADMIN_EMAILS to change or (empty) to disable.
    additional-admin-emails: ${BOOTSTRAP_ADDITIONAL_ADMIN_EMAILS:trendyshaccosmetic@gmail.com}
    # Same as above but under the DEVELOPER role (identical permissions, distinct label) — the
    # engineering account, kept separate from the shop owner's SUPER_ADMIN account above.
    developer-emails: ${BOOTSTRAP_DEVELOPER_EMAILS:mdaucodes@gmail.com}
  stock:
    reservation-sweep-interval-ms: ${RESERVATION_SWEEP_INTERVAL_MS:60000}
  payments:
    # BANK: the customer pays the bank quoting a per-order reference (pay page at
    # /pay/{orderNo}); MPESA: Daraja STK push. Only BANK confirms via staff today.
    collection-mode: ${PAYMENT_COLLECTION_MODE:BANK}
    # How long the stock is held and the reference stays payable (bank transfers are slow).
    window-minutes: ${PAYMENT_WINDOW_MINUTES:45}
  bank:
    # Shown on the customer's pay page. Blank paybill-number hides the Paybill tab;
    # blank account-number hides the bank-transfer tab. Set to the client's real details.
    name: ${BANK_NAME:}
    paybill-number: ${BANK_PAYBILL_NUMBER:}
    # Fallback for what the customer types as the paybill "account" (an admin-set value in
    # Settings wins). Placeholders: <name> the customer's name, <phone>, <order> the order
    # number, <ref> the per-order payment reference; e.g. 01100123456#<name> when the bank needs
    # a fixed account prefix.
    paybill-account-template: ${BANK_PAYBILL_ACCOUNT_TEMPLATE:<name>}
    account-name: ${BANK_ACCOUNT_NAME:}
    account-number: ${BANK_ACCOUNT_NUMBER:}
    account-branch: ${BANK_ACCOUNT_BRANCH:}
    support-whatsapp: ${SUPPORT_WHATSAPP:}
  coop:
    ins:
      # Co-op Bank Instant Notification Service (deposit notifications). NOT tested against the real
      # bank. Blank credentials = reject everything. Agree these with the bank when registering the endpoint
      # https://<api-host>/api/v1/payments/coop/ins ; INS authenticates with this shared Basic credential only.
      username: ${COOP_INS_USERNAME:}
      password: ${COOP_INS_PASSWORD:}
      # When set, notifications for any other Co-op account number are ignored.
      account-number: ${COOP_INS_ACCOUNT_NUMBER:}
      # false (default): record each credit for staff to allocate. true: confirm an order automatically when the
      # credit carries a valid reference and the exact amount. Turn on only after verifying against the real bank.
      auto-match: ${COOP_INS_AUTO_MATCH:false}
  mpesa:
    # UNSET PLACEHOLDERS — DarajaPaymentGateway refuses to call Safaricom until
    # real sandbox credentials are set here. See that class's javadoc.
    base-url: ${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
    consumer-key: ${MPESA_CONSUMER_KEY:}
    consumer-secret: ${MPESA_CONSUMER_SECRET:}
    shortcode: ${MPESA_SHORTCODE:}
    passkey: ${MPESA_PASSKEY:}
    # MUST end in /<callback-secret>'s value below, e.g.
    # https://api.example.com/api/v1/payments/mpesa/callback/<random-secret>
    callback-url: ${MPESA_CALLBACK_URL:}
    # §4 C1 fix — a high-entropy random value (e.g. `openssl rand -hex 32`),
    # never committed, matched via PaymentController.isAuthenticCallback.
    # Blank (the default) means the callback endpoint rejects every request —
    # set this BEFORE the callback URL is ever registered with Safaricom.
    callback-secret: ${MPESA_CALLBACK_SECRET:}
  cloudinary:
    # UNSET PLACEHOLDERS — CloudinarySignatureService refuses to sign an
    # upload until all three are set. Get these from the Cloudinary console
    # once Trendysh has an account (free tier is enough to start).
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

server:
  port: ${PORT:8081}

# Tier 2 item 13: previously SecurityConfig permitted /actuator/health with no
# actuator dependency at all — a 404 masquerading as a working health check.
# Real now. health/info/metrics/prometheus only — never expose the full
# actuator surface (env, beans, etc.) publicly.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.nbh.backend: DEBUG
