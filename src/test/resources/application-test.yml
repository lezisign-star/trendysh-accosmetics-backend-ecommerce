spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nairobi_beauty_hub_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # §4 C5: lets OrderReadQueryCountTest assert an order read is O(1)
        # queries, not O(n) in item count — a mechanical guard against the
        # N+1 regressing back in, rather than relying on it being noticed by
        # eye every session.
        generate_statistics: true
  flyway:
    clean-disabled: false

app:
  bootstrap:
    # The placeholder Super Admin the integration tests sign in as. Production no longer creates one by default
    # (see StaffUserSeeder), so the tests ask for it explicitly.
    admin-email: admin@nairobibeautyhub.co.ke
  mpesa:
    # Known value for live/manual testing of the callback endpoint (§4 C1) —
    # never used outside the test profile.
    callback-secret: test-only-callback-secret-not-for-any-real-deployment
  # Background sweepers are held off for an hour so they cannot fire while a test runs: Hibernate's
  # statistics (which OrderReadQueryCountTest asserts on) count statements from EVERY thread, so a
  # sweep landing mid-test made that count flaky. Tests that need a sweep call the sweeper directly.
  orders:
    expiry-sweep-initial-delay-ms: 3600000
    reminder-sweep-initial-delay-ms: 3600000
  stock:
    reservation-sweep-initial-delay-ms: 3600000
  # Emails are sent on the calling thread in tests, so a test can assert on a send (e.g. read a one-time
  # code out of it) as soon as the request returns.
  email:
    sync-send: true
  tumaboda:
    # A rider is booked on the calling thread, so a test can assert on the booking without polling; the
    # retry and reconciliation jobs are held off for an hour like the other sweepers (tests call them directly).
    sync-booking: true
    retry-initial-delay-ms: 3600000
    reconcile-initial-delay-ms: 3600000
  live:
    # A live update is written on the calling thread, so a test can assert on it as soon as the request
    # returns; the heartbeat (which would otherwise show up as an extra write partway through a slow test)
    # is held off for an hour, same as the other background sweepers above.
    sync: true
    heartbeat-ms: 3600000
    # Visitors are told about changes by a slow scheduled flush; held off for an hour like the heartbeat so
    # a test decides exactly when visitors are told (it calls the flush itself).
    public-flush-ms: 3600000
  catalog:
    # The catalogue page cache is off in the general suite: many tests change data with a direct database
    # write (which, unlike an admin edit, announces nothing) and then read the storefront straight away.
    # The cache's own tests switch it on explicitly.
    page-cache-ttl-ms: 0

logging:
  level:
    # generate_statistics above also auto-enables a per-session "Session
    # Metrics" INFO dump on every session close — drowns out real test
    # output. The counters OrderReadQueryCountTest reads come straight from
    # the SessionFactory's Statistics object, not from this logger.
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
